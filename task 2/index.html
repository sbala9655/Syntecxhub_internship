<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <h1>📝 To-Do List</h1>

    <!-- Input Section -->
    <div class="input-area">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task">

        <button id="addBtn">
            <i class="fa-solid fa-plus"></i>
            Add
        </button>

    </div>

    <!-- Search & Filter -->
    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search task">



        <button id="themeBtn">
            🌙 Dark Mode
        </button>

    </div>

    <!-- Counter -->
    <div class="counter">

        <span id="taskCounter">
            Total : 0
        </span>

        <span id="completedCounter">
            Completed : 0
        </span>

    </div>

    <!-- Task List -->
    <ul id="taskList">

    </ul>

    <!-- Show Task Button -->
    <div class="show-task-area">
        <button id="showTaskBtn">
            Show Task
        </button>
        <button id="clearAllBtn">
            Clear All
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
